volume2:
- id: overview
  title: From the Riemann Hypothesis to the zeros of Dirichlet L-functions
  proves: The Riemann Hypothesis follows from the statement that no Dirichlet L-function vanishes in Re(s) > 1/2
    (apart from the pole of zeta at 1); statement of the main theorem and a map of the whole proof.
  draws_on: [proof/00-overview, steps/riemann-hypothesis, steps/rh-of-all, steps/rh-of-every, steps/rh-of-right,
    steps/all-chi, steps/every-character-def, remark step 20]
  details_in: [15]
- id: weil-positivity
  title: The explicit formula, Weil positivity and determinants
  proves: 'Weil''s criterion: GRH is equivalent to the positivity of the Weil functional; the Guinand-Weil sign
    for the test function with Lambda(n)(X/n - 1)_+; positivity for a test function with a factor X^eta gives a
    bound past 1 - eta; positivity read as a Stepanov determinant with multiplicity one. This is the guiding idea;
    the Lean code has only parts of it.'
  draws_on: [remark steps 1, 4, 5, 6, proof/07-weil-bound, proof/11-determinants, paths/l-functions]
  details_in: [11, 15]
- id: architecture
  title: 'The architecture: the Galois row, the window bound and the literature statements'
  proves: 'EveryCharacter follows from three statements: the row Row0b with local parameters satisfying IsRecT,
    the existence RecTExists of a local Langlands map with its properties, and the window bound VWin; the seven
    inputs of the theta matching theorem and how the trunk reaches them.'
  draws_on:
  - proof/01-trunk
  - paths/trunk
  - steps/every-character
  - steps/every-character-of-row
  - steps/row-def
  - steps/row0b-def
  - steps/is-rect-def
  - steps/rect-exists-def
  - steps/rect-exists
  - steps/local-langlands-gl-rect-exists-of-literature
  - steps/open-literature-statements-def
  details_in: [15]
- id: siegel-weil
  title: Theta series, the Weil representation and the Siegel-Weil formula
  proves: The Weil representation of the metaplectic group and its Schrödinger model; the Siegel-Weil formula for
    doubled unitary groups in the cases n < m, n = m, m < n and holomorphy at s0; finite volume and Siegel densities;
    rapid decay of cusp forms with a Sobolev bound; the automorphy of mu as a period integral of thetas and the
    relative trace formula on the sixfold cover of GL(5).
  draws_on: [proof/09-siegel-weil, paths/siegel-weil, remark steps 3, 16]
  details_in: [12, 8, 10, 5]
- id: determinants
  title: 'Nonvanishing of theta lifts: block determinants and theta Parseval'
  proves: 'TLiftK: an automorphic representation of a definite unitary group U(X) over a CM field lifts, for every
    large skew-hermitian W, to a nonzero automorphic representation of U(W) with matched weights and matched split
    components; the proof by test vectors made of leading minors, theta Parseval (the Rallis inner product formula)
    and a main term larger than the tail.'
  draws_on: [proof/11-determinants, paths/determinants, steps/t-lift-k, steps/tlift-k-def, remark steps 1, 4]
  details_in: [12, 11, 7]
- id: galois-row
  title: Galois representations for regular algebraic cuspidal representations over CM fields
  proves: 'Row0b: every regular algebraic cuspidal representation of GL(a) over a CM field has an l-adic Galois
    representation with strong local-global compatibility at every place; the geometric branch (Hecke towers, Eichler-Shimura,
    the crystalline step, Hodge-Tate decomposition) and the theta lift branch built on the previous chapter.'
  draws_on:
  - proof/02-galois-row
  - paths/galois-row
  - steps/galois-row-holds
  - steps/galois-local-global-strong-of-geometry-lift
  - steps/galois-representations-of-theta-lift
  - steps/geo-one-def
  - steps/geo-one-holds
  - remark step 8
  details_in: [3, 4, 5, 9, 12]
- id: window-bound
  title: Iwasawa towers and the window bound
  proves: 'VWin from Row0b: bounds on the lengths of Tate-Shafarevich groups in H^1(O_E[1/l], Q_l/Z_l(-e)) along
    an Iwasawa tower chosen with Behrend''s construction, a weak form of Vandiver''s conjecture, through CM and
    abelian variety inputs, Lemma K and four counts.'
  draws_on:
  - proof/03-vwin
  - paths/vwin
  - steps/vwin-def
  - steps/vwin-of-row
  - steps/automorphic-window-of-inputs
  - steps/base-change-n
  - steps/base-change-isobaric-n-def
  - steps/v-window-of-depth-zero-residual-bc-cm
  - steps/cm-abelian-inputs-from-literature
  - remark steps 11
  - 17
  - 19
  details_in: [9, 4, 13, 11, 15]
- id: weil-bound
  title: 'Arithmetic positivity: slopes, volumes and good towers'
  proves: 'DeepStR: from resolution and principalization, Moriwaki bigness, the arithmetic Hilbert-Samuel formula,
    Zarhin''s trick and a Siegel lemma, a slope bound and the volume theorem for good towers of models of Shimura
    varieties (the Bost slope inequality of the note).'
  draws_on: [proof/07-weil-bound, paths/weil-bound, remark step 13]
  details_in: [3, 5, 6]
- id: cm-divisibility
  title: CM curves, the invariant derivation and divisibility of theta values
  proves: A CM curve with good reduction outside p for p = 3 mod 4; D^p = 0 modulo p on the formal group for p inert
    (a Hasse-Witt type formula); lower bounds on valuations of derivatives of theta functions over periods; the
    Chowla-Selberg formula; the norm bound for lifts and a gcd of depths across Hecke characters.
  draws_on: [proof/10-cm-divisibility, paths/cm-divisibility, remark steps 2, 9, 10, 15]
  details_in: [13, 14, 5]
- id: bessel-seesaw
  title: Iterated theta lifts, seesaw identities and Bessel periods
  proves: 'FunctionalsSeparate: along the tower of iterated theta lifts U(X0) to U(Xm), the Bessel period of the
    lift is a seesaw period independent of the Hecke characters, it is nonzero for every Hecke eigen-direction,
    and local multiplicity one at the real place gives one test datum for all directions; interlacing of weights.'
  draws_on: [proof/08-bessel-seesaw, paths/bessel-seesaw, remark steps 7, 8, 12]
  details_in: [12, 7, 14]
- id: unitary-hypotheses
  title: 'The unitary group hypotheses: unramified exponents, the open orbit and surjectivity'
  proves: 'The record HypsAlt of unitary group hypotheses is nonempty under the definite side condition, given the
    closed bound: large unramified exponents, the open orbit, surjectivity onto X and the lower bound for lambda,
    rows and frames; covolumes, the index of theta series and congruences between lifts and forms; the cost of each
    lift.'
  draws_on:
  - proof/06-unitary-hypotheses
  - paths/unitary-hypotheses
  - steps/hyps-alt-def
  - steps/unitary-group-third-place-hypotheses-def
  - steps/nonempty-hyps
  - steps/closed-def
  - steps/definite-side-condition-def
  - steps/covolume-bound-of-x-def
  - steps/theta-local-inputs-def
  - remark steps 14
  - 18
  details_in: [10, 14, 15, 8]
- id: literature
  title: The statements taken from the literature
  proves: 'The structure of open literature statements and its nine bundles: which published theorems the proof
    assumes (Hecke and Tate, base change, Siegel-Weil, Howe duality, toroidal compactifications and others), how
    they enter, and which of them the development proves.'
  draws_on: [proof/04-literature, paths/literature, steps/every-character-of-literature, steps/published-results-first,
    steps/published-results-arithmetic, steps/published-results-eigen, steps/open-image-condition-def]
  details_in: [15, 8, 9]
- id: conclusion
  title: 'Theta integrals, local matching and the green window: no zeros to the right of the line'
  proves: Theta integrals agree and match locally; regular characters are green; green characters and the window
    bound give a zero-free region Re(s) > 1/2; imprimitive characters reduce to primitive ones; so every Dirichlet
    L-function has no zero with Re(s) > 1/2.
  draws_on:
  - proof/05-theta-matching
  - paths/theta-matching
  - steps/theta-integrals-agree-def
  - steps/local-matching-def
  - steps/theta-local-matching
  - steps/theta-integrals-agree-and-local-matching-of-literature
  - steps/green-def
  - steps/green-of-regular
  - steps/green-vwin
  - steps/zero-free-all-of-green-v-win
  - steps/imprimitive
  - remark steps 5
  - 18
  details_in: [12, 15, 11, 8]
