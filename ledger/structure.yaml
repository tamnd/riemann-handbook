# The plan of the handbook. volume1 and volume2: the chapters of Volumes 1 and 2. volumes: Volumes 3 to 15, by
# subject. Each chapter takes the old chapters in `from` (keys <old volume>/<chapter id> of the first plan). An old
# chapter that several chapters take is split: `split` says how in words, and `roots` (the root declarations of the
# piece: an entry goes to the piece of the nearest root above it in the dominator tree) or `folders` (the Lean
# subfolders of the piece) say it for `rhb ledger`. The piece with neither takes the rest.
