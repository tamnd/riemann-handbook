[project]
name = "rhb"
version = "0.1.0"
description = "The builder of The Riemann Handbook: tamnd/riemann and tamnd/riemann-lean as PDF and EPUB volumes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6", "Pillow>=10", "fonttools>=4.40"]

[project.scripts]
rhb = "rhb.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rhb"]
